name: CI

# Runs on every push / PR: static analysis, unit + widget tests, and a real
# Android build so Gradle/AGP/plugin problems surface immediately.
# The release-APK publishing workflow is added in Phase 6.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # lets the "Report" steps attach log tails as a commit comment when a job fails

defaults:
  run:
    # Explicit bash => `-eo pipefail`, so `flutter … | tee` keeps flutter's exit code.
    shell: bash

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SQLite (used by sqflite_common_ffi in repository tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - name: Flutter version
        run: flutter --version | tee versions.log

      - name: Resolve dependencies
        run: |
          flutter pub get 2>&1 | tee pubget.log
          # The app-local plugin is analysed as its own package context.
          (cd packages/platform_bridge && flutter pub get) 2>&1 | tee -a pubget.log

      # Analyzer lines are also re-emitted as GitHub annotations so they show up
      # inline on the commit / PR diff.
      - name: Analyze
        id: analyze
        run: |
          flutter analyze 2>&1 | tee analyze.log | sed -E \
            's#^[[:space:]]*(info|warning|error) • (.*) • ([^ ]+):([0-9]+):([0-9]+) • (.*)$#::\1 file=\3,line=\4,col=\5,title=\6::\2#; s#^::info #::notice #'

      - name: Run tests
        id: test
        if: ${{ always() && steps.analyze.outcome != 'skipped' }}
        run: flutter test --reporter expanded 2>&1 | tee test.log

      - name: Report (commit comment with log tails)
        if: ${{ failure() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          section() { # title file
            echo "<details><summary>$1</summary>"; echo; echo '```'
            if [ -s "$2" ]; then tail -c 20000 "$2"; else echo "(no output)"; fi
            echo '```'; echo '</details>'; echo
          }
          {
            echo "### CI – Analyze & test: analyze=${{ steps.analyze.outcome }}, test=${{ steps.test.outcome }}"
            echo
            section "flutter --version" versions.log
            section "flutter pub get" pubget.log
            section "flutter analyze" analyze.log
            section "flutter test" test.log
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md > /dev/null

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve dependencies
        run: flutter pub get

      # Google Sign-In (YouTube) needs every APK to be signed with the SAME key
      # whose SHA-1 is registered in Google Cloud. When the ANDROID_KEYSTORE_*
      # secrets exist the build uses that keystore; otherwise it falls back to
      # a throw-away debug key (installable, but sign-in will not work).
      - name: Configure release signing (from secrets, optional)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS:-upload}"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "mode=release keystore (repository secrets)" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug key generated on this runner" >> "$GITHUB_OUTPUT"
          fi

      # Release mode = the same bits you will sideload.
      - name: Build release APK
        id: build
        run: flutter build apk --release 2>&1 | tee build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-automation-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # The SHA-1 shown here is what goes into the Android OAuth client.
      - name: Report signing certificate (job summary)
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          fmt() { echo "$1" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//'; }
          SHA1=$(fmt "$(echo "$CERTS" | sed -n 's/.*SHA-1 digest: *//p' | head -n 1)")
          SHA256=$(fmt "$(echo "$CERTS" | sed -n 's/.*SHA-256 digest: *//p' | head -n 1)")
          {
            echo "### APK signing certificate"
            echo
            echo "Signed with: **${{ steps.signing.outputs.mode }}**"
            echo
            echo '```'
            echo "SHA-1:   $SHA1"
            echo "SHA-256: $SHA256"
            echo '```'
            if [[ "${{ steps.signing.outputs.mode }}" == debug* ]]; then
              echo
              echo "> ⚠️ This key is regenerated on every run, so **Google Sign-In for YouTube will not work with this APK**."
              echo "> Add the \`ANDROID_KEYSTORE_BASE64\` / \`ANDROID_KEYSTORE_PASSWORD\` / \`ANDROID_KEY_ALIAS\` / \`ANDROID_KEY_PASSWORD\` secrets (README → Phase 4) so every build is signed with the same key, then register that key's SHA-1 in Google Cloud."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report (commit comment with build log tail)
        if: ${{ failure() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI – Build Android APK: ${{ steps.build.outcome }}"
            echo
            echo '<details><summary>flutter build apk --release</summary>'; echo; echo '```'
            if [ -s build.log ]; then tail -c 30000 build.log; else echo "(no output)"; fi
            echo '```'; echo '</details>'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md > /dev/null
